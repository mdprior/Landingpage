<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0d0d">

  <title>Still in process...</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background: #0d0d0d;
      color: #f2f2f2;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .content {
      padding: 2rem;
      text-align: center;
      opacity: 0;
      animation: appear 2.8s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    h1 {
      margin-bottom: 1.15rem;
      font-size: clamp(2rem, 5vw, 4.6rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .process {
      color: #777;
      font-size: clamp(.72rem, 1.2vw, .92rem);
      font-weight: 400;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .dots {
      display: inline-block;
      min-width: 1.5em;
    }

    .dots span {
      opacity: .2;
      animation: dot 2.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .3s;
    }

    .dots span:nth-child(3) {
      animation-delay: .6s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dot {
      0%, 60%, 100% { opacity: .2; }
      30% { opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content {
        opacity: 1;
        animation: none;
      }

      .dots span {
        opacity: .65;
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="content">
    <h1>Hier entsteht eine Vision.</h1>

    <p class="process">
      still in process<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
    </p>
  </main>
</body>
</html>
